<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JohnMotos - Sistema de Gestão</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- SDK do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased pb-20 md:pb-0">

  <!-- HEADER FIXO -->
  <header class="bg-slate-900 text-white px-4 py-3 sticky top-0 z-40 shadow flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-red-600 rounded-xl flex items-center justify-center font-bold text-xl shadow">
        <i class="ph-bold ph-motorcycle"></i>
      </div>
      <div>
        <h1 class="font-bold text-base leading-tight">JOHN MOTOS</h1>
        <p class="text-[10px] text-slate-400">ERP & Gestão</p>
      </div>
    </div>
    <span class="text-xs bg-emerald-600 px-3 py-1 rounded-full font-semibold">Caixa Aberto</span>
  </header>

  <!-- BOTTOM NAVIGATION (App Mobile) / TOP BAR (Desktop) -->
  <nav class="bg-white border-t border-slate-200 fixed bottom-0 left-0 right-0 md:top-[61px] md:bottom-auto md:border-t-0 md:border-b md:bg-slate-900 z-50">
    <div class="max-w-6xl mx-auto flex justify-around md:justify-center md:gap-8 py-2 md:py-2.5">
      <a href="index.html" class="flex flex-col md:flex-row items-center gap-1 md:gap-2 text-red-600 md:text-white md:border-b-2 md:border-red-600 pb-1 text-[11px] md:text-xs font-semibold">
        <i class="ph-bold ph-chart-pie-slice text-xl"></i> <span>Início</span>
      </a>
      <a href="pdv.html" class="flex flex-col md:flex-row items-center gap-1 md:gap-2 text-slate-400 hover:text-red-600 md:hover:text-white text-[11px] md:text-xs font-semibold">
        <i class="ph-bold ph-shopping-cart text-xl"></i> <span>PDV</span>
      </a>
      <a href="oficina.html" class="flex flex-col md:flex-row items-center gap-1 md:gap-2 text-slate-400 hover:text-red-600 md:hover:text-white text-[11px] md:text-xs font-semibold">
        <i class="ph-bold ph-wrench text-xl"></i> <span>Oficina</span>
      </a>
      <a href="produtos.html" class="flex flex-col md:flex-row items-center gap-1 md:gap-2 text-slate-400 hover:text-red-600 md:hover:text-white text-[11px] md:text-xs font-semibold">
        <i class="ph-bold ph-package text-xl"></i> <span>Estoque</span>
      </a>
      <a href="financeiro.html" class="flex flex-col md:flex-row items-center gap-1 md:gap-2 text-slate-400 hover:text-red-600 md:hover:text-white text-[11px] md:text-xs font-semibold">
        <i class="ph-bold ph-currency-dollar text-xl"></i> <span>Financeiro</span>
      </a>
    </div>
  </nav>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="max-w-6xl mx-auto p-4 space-y-5">

    <!-- MÉTRICAS DO DIA -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm flex justify-between items-center">
        <div>
          <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Vendas Hoje (PDV)</span>
          <h2 id="metric-vendas" class="text-xl font-extrabold text-slate-800 mt-0.5">R$ 0,00</h2>
        </div>
        <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-xl">
          <i class="ph-bold ph-trend-up"></i>
        </div>
      </div>

      <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm flex justify-between items-center">
        <div>
          <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Motos na Oficina</span>
          <h2 id="metric-motos" class="text-xl font-extrabold text-slate-800 mt-0.5">0</h2>
        </div>
        <div class="w-10 h-10 bg-red-50 text-red-600 rounded-xl flex items-center justify-center text-xl">
          <i class="ph-bold ph-motorcycle"></i>
        </div>
      </div>
    </div>

    <!-- MÓDULOS DE GESTÃO -->
    <div>
      <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Módulos do Sistema</h3>
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
        
        <a href="pdv.html" class="bg-white border border-slate-200 hover:border-red-500 p-4 rounded-2xl flex flex-col items-center text-center gap-2 transition-all shadow-sm group">
          <div class="w-12 h-12 bg-red-50 text-red-600 rounded-xl flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">
            <i class="ph-bold ph-shopping-cart"></i>
          </div>
          <span class="text-xs font-bold text-slate-700">Frente de Caixa (PDV)</span>
        </a>

        <a href="oficina.html" class="bg-white border border-slate-200 hover:border-red-500 p-4 rounded-2xl flex flex-col items-center text-center gap-2 transition-all shadow-sm group">
          <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">
            <i class="ph-bold ph-wrench"></i>
          </div>
          <span class="text-xs font-bold text-slate-700">Ordens de Serviço</span>
        </a>

        <a href="produtos.html" class="bg-white border border-slate-200 hover:border-red-500 p-4 rounded-2xl flex flex-col items-center text-center gap-2 transition-all shadow-sm group">
          <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">
            <i class="ph-bold ph-package"></i>
          </div>
          <span class="text-xs font-bold text-slate-700">Produtos & Peças</span>
        </a>

        <a href="clientes.html" class="bg-white border border-slate-200 hover:border-red-500 p-4 rounded-2xl flex flex-col items-center text-center gap-2 transition-all shadow-sm group">
          <div class="w-12 h-12 bg-purple-50 text-purple-600 rounded-xl flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">
            <i class="ph-bold ph-users"></i>
          </div>
          <span class="text-xs font-bold text-slate-700">Clientes & Motos</span>
        </a>

        <a href="compras.html" class="bg-white border border-slate-200 hover:border-red-500 p-4 rounded-2xl flex flex-col items-center text-center gap-2 transition-all shadow-sm group">
          <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">
            <i class="ph-bold ph-truck"></i>
          </div>
          <span class="text-xs font-bold text-slate-700">Compras & Entradas</span>
        </a>

        <a href="financeiro.html" class="bg-white border border-slate-200 hover:border-red-500 p-4 rounded-2xl flex flex-col items-center text-center gap-2 transition-all shadow-sm group">
          <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">
            <i class="ph-bold ph-currency-dollar"></i>
          </div>
          <span class="text-xs font-bold text-slate-700">Caixa & Contas</span>
        </a>

        <a href="relatorios.html" class="bg-white border border-slate-200 hover:border-red-500 p-4 rounded-2xl flex flex-col items-center text-center gap-2 transition-all shadow-sm group">
          <div class="w-12 h-12 bg-slate-100 text-slate-600 rounded-xl flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">
            <i class="ph-bold ph-chart-line"></i>
          </div>
          <span class="text-xs font-bold text-slate-700">Relatórios</span>
        </a>

      </div>
    </div>

  </main>

  <!-- SCRIPTS -->
  <script src="js/app.js"></script>

        // Se a tabela ainda não existir, o catch trata o erro sem quebrar a tela
      } catch (err) {
        console.log("Banco de dados aguardando configuração.");
      }

    carregarResumo();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão Profissional | Oficina & Peças</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- DaisyUI -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
  <!-- Bootstrap Icons (para ícones limpos) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* Ajustes finos para scrollbar e fontes */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex">

  <!-- SIDEBAR -->
  <aside id="sidebar" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col fixed inset-y-0 left-0 z-50 transition-transform duration-300 -translate-x-full lg:translate-x-0">
    <!-- Brand -->
    <div class="p-6 border-b border-slate-800 flex items-center gap-3">
      <div class="bg-blue-600 text-white p-2.5 rounded-xl shadow-lg shadow-blue-600/30">
        <i class="bi bi-tools text-xl"></i>
      </div>
      <div>
        <h1 class="font-bold tracking-wider text-sm text-white">OFICINA & PEÇAS</h1>
        <p class="text-xs text-slate-400" id="shopTitleNav">Gestão Profissional</p>
      </div>
    </div>

    <!-- Navigation -->
    <div class="flex-1 overflow-y-auto px-4 py-4 space-y-6">
      <div>
        <p class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider px-3 mb-2">Principal</p>
        <nav class="space-y-1">
          <button class="navbtn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition active" data-page="inicio">
            <i class="bi bi-speedometer2 text-lg"></i>Visão geral
          </button>
          <button class="navbtn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition" data-page="pdv">
            <i class="bi bi-cart3 text-lg"></i>PDV / Vendas
          </button>
          <button class="navbtn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition" data-page="produtos">
            <i class="bi bi-box-seam text-lg"></i>Produtos e estoque
          </button>
          <button class="navbtn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition" data-page="oficina">
            <i class="bi bi-wrench-adjustable text-lg"></i>Oficina / OS
          </button>
          <button class="navbtn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition" data-page="clientes">
            <i class="bi bi-people text-lg"></i>Clientes
          </button>
          <button class="navbtn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition" data-page="fornecedores">
            <i class="bi bi-truck text-lg"></i>Fornecedores
          </button>
        </nav>
      </div>

      <div>
        <p class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider px-3 mb-2">Gestão</p>
        <nav class="space-y-1">
          <button class="navbtn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition" data-page="financeiro">
            <i class="bi bi-wallet2 text-lg"></i>Financeiro
          </button>
          <button class="navbtn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition" data-page="relatorios">
            <i class="bi bi-graph-up text-lg"></i>Relatórios
          </button>
          <button class="navbtn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition" data-page="config">
            <i class="bi bi-gear text-lg"></i>Configurações
          </button>
        </nav>
      </div>
    </div>

    <!-- Footer Sidebar -->
    <div class="p-4 border-t border-slate-800 m-4 rounded-xl bg-slate-950/50">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-xs font-medium text-slate-300">Sistema Local Ativo</span>
      </div>
    </div>
  </aside>

  <!-- MAIN WRAPPER -->
  <div class="flex-1 flex flex-col lg:pl-64 min-w-0">
    <!-- TOPBAR -->
    <header class="h-20 bg-slate-900/80 backdrop-blur border-b border-slate-800 px-6 lg:px-10 flex items-center justify-between sticky top-0 z-40">
      <div class="flex items-center gap-4">
        <button id="sidebarToggle" class="btn btn-square btn-ghost lg:hidden text-slate-300">
          <i class="bi bi-list text-xl"></i>
        </button>
        <div>
          <h2 id="pageTitle" class="text-xl font-bold text-white tracking-tight">Visão geral</h2>
          <p id="todayDate" class="text-xs text-slate-400"></p>
        </div>
      </div>
      <div>
        <button class="btn btn-primary btn-sm gap-2 shadow-lg shadow-blue-600/20" onclick="navigate('pdv')">
          <i class="bi bi-plus-lg"></i> Nova Venda
        </button>
      </div>
    </header>

    <!-- CONTENT AREA -->
    <main class="flex-1 p-6 lg:p-10 max-w-7xl w-full mx-auto" id="content">
      <!-- Inserido dinamicamente -->
    </main>

    <!-- FOOTER -->
    <footer class="text-center py-6 text-xs text-slate-500 border-t border-slate-800/60 mt-auto">
      Sistema de Gestão Integrado · Armazenamento Local Seguro
    </footer>
  </div>

  <script>
    "use strict";

    const $ = id => document.getElementById(id);
    const money = n => Number(n || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    const todayISO = () => new Date().toLocaleDateString("en-CA");
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    const safe = s => String(s ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
    const dateBR = d => d ? new Date(d + "T12:00:00").toLocaleDateString("pt-BR") : "—";

    const STORAGE_KEY = "gestao_oficina_daisyui_v1";

    function emptyDB() {
      return {
        products: [], customers: [], suppliers: [],
        sales: [], orders: [], transactions: [],
        settings: { shop: "Oficina & Peças", currency: "BRL" }
      };
    }

    function loadDB() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return emptyDB();
        const data = JSON.parse(raw);
        const base = emptyDB();
        return { ...base, ...data, settings: { ...base.settings, ...(data.settings || {}) } };
      } catch (e) {
        console.error(e);
        return emptyDB();
      }
    }

    let db = loadDB();
    let cart = [];
    let chartInstance = null;
    let currentPage = "inicio";

    function saveDB() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        return true;
      } catch (e) {
        toast("Erro ao salvar dados.", "error");
        return false;
      }
    }

    function toast(message, icon = "success") {
      Swal.fire({
        toast: true, position: "top-end", showConfirmButton: false,
        timer: 2500, timerProgressBar: true, icon, title: message,
        background: "#0f172a", color: "#f8fafc"
      });
    }

    async function modalForm(title, fields) {
      return Swal.fire({
        title, background: "#0f172a", color: "#f8fafc",
        confirmButtonText: "Salvar", cancelButtonText: "Cancelar",
        showCancelButton: true, focusConfirm: false,
        customClass: { confirmButton: 'btn btn-primary', cancelButton: 'btn btn-ghost' },
        buttonsStyling: false,
        html: fields.map(f => {
          const value = f.value ?? "";
          if (f.type === "select") {
            return `<div class="form-control w-full text-left mb-3">
              <label class="label"><span class="label-text text-slate-400">${safe(f.label)}</span></label>
              <select id="f_${safe(f.id)}" class="select select-bordered w-full bg-slate-950 border-slate-700">
              ${f.options.map(o => `<option value="${safe(o.value)}" ${String(o.value) === String(value) ? "selected" : ""}>${safe(o.label)}</option>`).join("")}
              </select></div>`;
          }
          return `<div class="form-control w-full text-left mb-3">
            <label class="label"><span class="label-text text-slate-400">${safe(f.label)}</span></label>
            <input id="f_${safe(f.id)}" class="input input-bordered w-full bg-slate-950 border-slate-700" type="${f.type || "text"}" value="${safe(value)}"
            ${f.required ? "required" : ""} ${f.min !== undefined ? `min="${f.min}"` : ""} ${f.step ? `step="${f.step}"` : ""} placeholder="${safe(f.placeholder || "")}">
          </div>`;
        }).join(""),
        preConfirm: () => {
          const result = {};
          for (const f of fields) {
            const el = $("f_" + f.id);
            result[f.id] = el ? el.value.trim() : "";
            if (f.required && !result[f.id]) {
              Swal.showValidationMessage("Preencha o campo: " + f.label);
              return false;
            }
          }
          return result;
        }
      });
    }

    async function askConfirm(title, text) {
      const r = await Swal.fire({
        title, text, icon: "warning", background: "#0f172a", color: "#f8fafc",
        showCancelButton: true, confirmButtonText: "Sim, confirmar", cancelButtonText: "Cancelar",
        customClass: { confirmButton: 'btn btn-error', cancelButton: 'btn btn-ghost' },
        buttonsStyling: false
      });
      return r.isConfirmed;
    }

    function setPageTitle(title) {
      $("pageTitle").textContent = title;
    }

    function navigate(page) {
      currentPage = page;
      document.querySelectorAll(".navbtn").forEach(b => {
        b.classList.toggle("active", b.dataset.page === page);
        if (b.dataset.page === page) {
          b.classList.add("bg-slate-800", "text-white");
          b.classList.remove("text-slate-400");
        } else {
          b.classList.remove("bg-slate-800", "text-white");
          b.classList.add("text-slate-400");
        }
      });
      const sidebar = $("sidebar");
      if (window.innerWidth < 1024) sidebar.classList.add("-translate-x-full");
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.querySelectorAll(".navbtn").forEach(b => {
      b.addEventListener("click", () => navigate(b.dataset.page));
    });
    $("sidebarToggle").addEventListener("click", () => $("sidebar").classList.toggle("-translate-x-full"));
    $("todayDate").textContent = new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long", year: "numeric" });
    $("shopTitleNav").textContent = db.settings.shop;

    function table(headers, rows, empty = "Nenhum registro encontrado.") {
      return `<div class="overflow-x-auto bg-slate-900 border border-slate-800 rounded-2xl shadow-xl"><table class="table table-zebra w-full">
      <thead><tr class="border-slate-800 text-slate-400 bg-slate-950/50">${headers.map(h => `<th>${h}</th>`).join("")}</tr></thead>
      <tbody>${rows.length ? rows.join("") : `<tr><td colspan="${headers.length}" class="text-center text-slate-500 py-12">${empty}</td></tr>`}</tbody>
      </table></div>`;
    }

    function badge(text, type = "badge-neutral") {
      return `<span class="badge ${type} font-medium text-xs">${safe(text)}</span>`;
    }

    function metricCard(title, value, icon, color = "text-blue-500", sub = "") {
      return `<div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col justify-between">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">${title}</p>
            <h3 class="text-2xl font-black text-white mt-2">${value}</h3>
          </div>
          <div class="p-3.5 rounded-2xl bg-slate-800/80 ${color} shadow-inner">
            <i class="bi bi-${icon} text-xl"></i>
          </div>
        </div>
        ${sub ? `<p class="text-xs text-slate-500 mt-4">${sub}</p>` : ""}
      </div>`;
    }

    function pageHeader(title, description, buttonText, action) {
      return `<div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
        <div>
          <h3 class="text-2xl font-bold text-white tracking-tight">${title}</h3>
          <p class="text-sm text-slate-400 mt-1">${description}</p>
        </div>
        ${buttonText ? `<button class="btn btn-primary btn-sm gap-2 shadow-lg shadow-blue-600/20" onclick="${action}"><i class="bi bi-plus-lg"></i>${buttonText}</button>` : ""}
      </div>`;
    }

    function searchInput(placeholder) {
      return `<div class="relative mb-6 max-w-sm">
        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500"><i class="bi bi-search"></i></span>
        <input id="tableSearch" class="input input-bordered input-sm w-full pl-10 bg-slate-900 border-slate-800 focus:border-blue-500 text-slate-200" placeholder="${placeholder}" oninput="filterTable(this.value)">
      </div>`;
    }

    function filterTable(val) {
      const q = val.toLowerCase();
      document.querySelectorAll("table tbody tr").forEach(tr => {
        tr.style.display = tr.textContent.toLowerCase().includes(q) ? "" : "none";
      });
    }

    function render() {
      const pages = {
        inicio: renderHome, pdv: renderPDV, produtos: renderProducts,
        oficina: renderWorkshop, clientes: renderCustomers, fornecedores: renderSuppliers,
        financeiro: renderFinance, relatorios: renderReports, config: renderSettings
      };
      (pages[currentPage] || renderHome)();
    }

    /* --- HOME --- */
    function renderHome() {
      setPageTitle("Visão geral");
      const today = todayISO();
      const todaySales = db.sales.filter(s => s.date === today);
      const revenue = todaySales.reduce((a, s) => a + s.total, 0);
      const lowStock = db.products.filter(p => p.active !== false && p.stock <= p.min);
      const pendingOS = db.orders.filter(o => o.status !== "Concluída" && o.status !== "Entregue" && o.status !== "Cancelada");

      const lowRows = lowStock.slice(0, 5).map(p => `<tr><td>${safe(p.name)}</td><td><span class="text-error font-bold">${p.stock}</span></td><td>${p.min}</td><td>${badge("Baixo", "badge-error")}</td></tr>`);
      const osRows = pendingOS.slice(0, 5).map(o => `<tr><td>${safe(o.number)}</td><td>${safe(o.customer)}</td><td>${safe(o.motorcycle)}</td><td>${badge(o.status, "badge-warning")}</td></tr>`);

      $("content").innerHTML = `
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-8">
          ${metricCard("Vendas de Hoje", money(revenue), "cart-check", "text-emerald-400", todaySales.length + " venda(s) registrada(s)")}
          ${metricCard("Produtos no Estoque", db.products.length, "box-seam", "text-blue-400")}
          ${metricCard("Ordens em Andamento", pendingOS.length, "tools", "text-amber-400", "Na oficina")}
          ${metricCard("Alerta de Estoque", lowStock.length, "exclamation-triangle", "text-rose-400", "Itens abaixo do mínimo")}
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <div class="flex justify-between items-center mb-5">
              <h4 class="font-bold text-white text-base">Estoque Baixo</h4>
              <button class="btn btn-ghost btn-xs text-blue-400" onclick="navigate('produtos')">Ver todos</button>
            </div>
            ${table(["Produto", "Qtd", "Mín", "Status"], lowRows, "Nenhum produto em alerta.")}
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <div class="flex justify-between items-center mb-5">
              <h4 class="font-bold text-white text-base">Ordens de Serviço Abertas</h4>
              <button class="btn btn-ghost btn-xs text-blue-400" onclick="navigate('oficina')">Ver oficina</button>
            </div>
            ${table(["OS", "Cliente", "Moto", "Status"], osRows, "Nenhuma OS em aberto.")}
          </div>
        </div>`;
    }

    /* --- PRODUTOS --- */
    function renderProducts() {
      setPageTitle("Produtos e Estoque");
      const rows = db.products.map(p => `<tr>
        <td><span class="font-mono text-xs text-slate-400">${safe(p.code || "—")}</span></td>
        <td class="font-bold text-white">${safe(p.name)}</td>
        <td>${safe(p.category || "Peças")}</td>
        <td>${money(p.cost)}</td>
        <td>${money(p.price)}</td>
        <td>${p.stock <= p.min ? badge(p.stock, "badge-error") : badge(p.stock, "badge-success")}</td>
        <td>
          <div class="flex gap-1">
            <button class="btn btn-ghost btn-xs text-slate-300" onclick="editProduct('${p.id}')"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-ghost btn-xs text-blue-400" onclick="stockMovement('${p.id}')"><i class="bi bi-plus-slash-minus"></i></button>
            <button class="btn btn-ghost btn-xs text-error" onclick="deleteProduct('${p.id}')"><i class="bi bi-trash"></i></button>
          </div>
        </td>
      </tr>`).reverse();

      $("content").innerHTML = pageHeader("Produtos e Estoque", "Gerencie peças, preços de custo, venda e quantidades.", "Novo Produto", "addProduct()") +
        searchInput("Pesquisar produto...") + table(["Código", "Nome", "Categoria", "Custo", "Venda", "Estoque", "Ações"], rows);
    }

    async function addProduct(existing = null) {
      const p = existing || {};
      const r = await modalForm(existing ? "Editar Produto" : "Novo Produto", [
        { id: "code", label: "Código / SKU", value: p.code || "" },
        { id: "name", label: "Nome do Produto", value: p.name || "", required: true },
        { id: "category", label: "Categoria", value: p.category || "Peças" },
        { id: "cost", label: "Preço de Custo (R$)", type: "number", value: p.cost ?? 0, min: 0, step: "0.01" },
        { id: "price", label: "Preço de Venda (R$)", type: "number", value: p.price ?? 0, min: 0, step: "0.01" },
        { id: "stock", label: "Quantidade em Estoque", type: "number", value: p.stock ?? 0, min: 0, step: "1" },
        { id: "min", label: "Estoque Mínimo", type: "number", value: p.min ?? 2, min: 0, step: "1" }
      ]);
      if (!r.isConfirmed) return;
      const item = { ...r.value, id: p.id || uid(), cost: Number(r.value.cost), price: Number(r.value.price), stock: Number(r.value.stock), min: Number(r.value.min), active: true };
      if (existing) db.products = db.products.map(x => x.id === p.id ? item : x);
      else db.products.push(item);
      saveDB(); toast("Produto salvo com sucesso!"); render();
    }
    function editProduct(id) { const p = db.products.find(x => x.id === id); if (p) addProduct(p); }
    async function deleteProduct(id) {
      if (!await askConfirm("Excluir produto?", "Essa ação não poderá ser desfeita.")) return;
      db.products = db.products.filter(p => p.id !== id);
      saveDB(); toast("Produto excluído."); render();
    }
    async function stockMovement(id) {
      const p = db.products.find(x => x.id === id); if (!p) return;
      const r = await modalForm("Movimentar Estoque: " + p.name, [
        { id: "kind", label: "Tipo de Movimento", type: "select", value: "Entrada", options: [{ value: "Entrada", label: "Entrada" }, { value: "Saída", label: "Saída" }] },
        { id: "qty", label: "Quantidade", type: "number", value: 1, min: 1, required: true },
        { id: "reason", label: "Motivo / Observação", value: "Ajuste de estoque" }
      ]);
      if (!r.isConfirmed) return;
      const qty = Number(r.value.qty);
      if (r.value.kind === "Saída" && qty > p.stock) return toast("Estoque insuficiente!", "error");
      p.stock += r.value.kind === "Entrada" ? qty : -qty;
      saveDB(); toast("Estoque atualizado!"); render();
    }

    /* --- PDV --- */
    function renderPDV() {
      setPageTitle("PDV / Frente de Caixa");
      const options = db.products.filter(p => p.active !== false).map(p => `<option value="${p.id}">${safe(p.name)} — ${money(p.price)} (Disp: ${p.stock})</option>`).join("");
      const cartRows = cart.map((c, i) => `<tr>
        <td class="font-medium">${safe(c.name)}</td><td>${c.qty}</td><td>${money(c.price)}</td><td>${money(c.qty * c.price)}</td>
        <td><button class="btn btn-ghost btn-xs text-error" onclick="removeCart(${i})"><i class="bi bi-x-lg"></i></button></td>
      </tr>`);
      const total = cart.reduce((a, c) => a + c.qty * c.price, 0);

      $("content").innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div class="lg:col-span-2 space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
              <h4 class="font-bold text-white mb-4">Adicionar Produtos</h4>
              <div class="grid grid-cols-1 sm:grid-cols-12 gap-3">
                <div class="sm:col-span-7">
                  <select id="cartProduct" class="select select-bordered w-full bg-slate-950 border-slate-700 text-sm"><option value="">Selecione um produto...</option>${options}</select>
                </div>
                <div class="sm:col-span-3">
                  <input id="cartQty" class="input input-bordered w-full bg-slate-950 border-slate-700 text-sm" type="number" min="1" value="1">
                </div>
                <div class="sm:col-span-2">
                  <button class="btn btn-primary w-full text-sm" onclick="addCart()">Adicionar</button>
                </div>
              </div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
              <h4 class="font-bold text-white mb-4">Itens no Carrinho</h4>
              ${table(["Produto", "Qtd", "Unitário", "Subtotal", ""], cartRows, "Nenhum item adicionado.")}
            </div>
          </div>
          <div>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
              <h4 class="font-bold text-white mb-2">Resumo da Venda</h4>
              <div class="form-control w-full">
                <label class="label"><span class="label-text text-slate-400">Cliente</span></label>
                <select id="saleCustomer" class="select select-bordered w-full bg-slate-950 border-slate-700 text-sm">
                  <option value="">Consumidor Final</option>
                  ${db.customers.map(c => `<option value="${c.id}">${safe(c.name)}</option>`).join("")}
                </select>
              </div>
              <div class="form-control w-full">
                <label class="label"><span class="label-text text-slate-400">Forma de Pagamento</span></label>
                <select id="salePayment" class="select select-bordered w-full bg-slate-950 border-slate-700 text-sm">
                  <option>Pix</option><option>Dinheiro</option><option>Débito</option><option>Crédito</option><option>A prazo</option>
                </select>
              </div>
              <div class="form-control w-full">
                <label class="label"><span class="label-text text-slate-400">Observações</span></label>
                <input id="saleNote" class="input input-bordered w-full bg-slate-950 border-slate-700 text-sm" placeholder="Opcional">
              </div>
              <div class="p-4 bg-slate-950 border border-slate-800 rounded-xl flex justify-between items-center my-4">
                <span class="text-slate-400 text-sm">Total:</span>
                <span class="text-2xl font-black text-emerald-400">${money(total)}</span>
              </div>
              <button class="btn btn-success w-full font-bold shadow-lg shadow-success/20 text-white" onclick="finishSale()">Finalizar Venda</button>
              <button class="btn btn-ghost w-full text-slate-400" onclick="cart=[];render()">Limpar Carrinho</button>
            </div>
          </div>
        </div>`;
    }

    function addCart() {
      const id = $("cartProduct").value;
      const qty = Number($("cartQty").value);
      const p = db.products.find(x => x.id === id);
      if (!p) return toast("Selecione um produto.", "error");
      const existing = cart.find(c => c.id === id);
      const wanted = qty + (existing ? existing.qty : 0);
      if (wanted > p.stock) return toast("Estoque insuficiente!", "error");
      if (existing) existing.qty += qty;
      else cart.push({ id: p.id, name: p.name, price: p.price, qty });
      render();
    }
    function removeCart(i) { cart.splice(i, 1); render(); }

    async function finishSale() {
      if (!cart.length) return toast("Carrinho vazio.", "error");
      const payment = $("salePayment").value;
      const total = cart.reduce((a, c) => a + c.qty * c.price, 0);
      const sale = {
        id: uid(), number: "VD-" + Date.now().toString().slice(-6),
        date: todayISO(), customer: db.customers.find(c => c.id === $("saleCustomer").value)?.name || "Consumidor Final",
        payment, total, items: [...cart]
      };
      cart.forEach(c => db.products.find(x => x.id === c.id).stock -= c.qty);
      db.sales.push(sale);
      db.transactions.push({ id: uid(), date: todayISO(), type: "Entrada", description: `Venda ${sale.number}`, value: total, status: payment === "A prazo" ? "Pendente" : "Concluído" });
      saveDB(); cart = [];
      await Swal.fire({ icon: "success", title: "Venda realizada com sucesso!", background: "#0f172a", color: "#f8fafc" });
      render();
    }

    /* --- OFICINA / OS --- */
    function renderWorkshop() {
      setPageTitle("Oficina / Ordens de Serviço");
      const rows = db.orders.map(o => `<tr>
        <td class="font-bold text-white">${safe(o.number)}</td>
        <td>${safe(o.customer)}</td>
        <td>${safe(o.motorcycle)}</td>
        <td>${safe(o.problem)}</td>
        <td>${badge(o.status, o.status === "Concluída" ? "badge-success" : "badge-warning")}</td>
        <td>${money(o.value)}</td>
        <td>
          <div class="flex gap-1">
            <button class="btn btn-ghost btn-xs text-slate-300" onclick="editOrder('${o.id}')"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-ghost btn-xs text-blue-400" onclick="orderStatus('${o.id}')"><i class="bi bi-arrow-repeat"></i></button>
          </div>
        </td>
      </tr>`).reverse();

      $("content").innerHTML = pageHeader("Ordens de Serviço", "Gerencie reparos, motos e andamento da oficina.", "Nova OS", "addOrder()") +
        searchInput("Pesquisar OS, cliente ou moto...") + table(["Nº OS", "Cliente", "Moto", "Defeito", "Status", "Valor", "Ações"], rows);
    }

    async function addOrder(existing = null) {
      const o = existing || {};
      const r = await modalForm(existing ? "Editar OS" : "Nova Ordem de Serviço", [
        { id: "customer", label: "Nome do Cliente", value: o.customer || "", required: true },
        { id: "motorcycle", label: "Moto / Modelo / Placa", value: o.motorcycle || "", required: true },
        { id: "problem", label: "Defeito Relatado", value: o.problem || "", required: true },
        { id: "service", label: "Serviço Executado", value: o.service || "" },
        { id: "value", label: "Valor Total (R$)", type: "number", value: o.value ?? 0, min: 0, step: "0.01" },
        { id: "status", label: "Status", type: "select", value: o.status || "Recebida", options: ["Recebida", "Em Análise", "Em Reparo", "Aguardando Peças", "Concluída", "Entregue"].map(x => ({ value: x, label: x })) }
      ]);
      if (!r.isConfirmed) return;
      const item = { ...r.value, id: o.id || uid(), number: o.number || "OS-" + Date.now().toString().slice(-5), date: o.date || todayISO(), value: Number(r.value.value) };
      if (existing) db.orders = db.orders.map(x => x.id === o.id ? item : x);
      else db.orders.push(item);
      saveDB(); toast("Ordem de serviço salva!"); render();
    }
    function editOrder(id) { const o = db.orders.find(x => x.id === id); if (o) addOrder(o); }
    async function orderStatus(id) {
      const o = db.orders.find(x => x.id === id); if (!o) return;
      const r = await modalForm("Alterar Status da " + o.number, [
        { id: "status", label: "Novo Status", type: "select", value: o.status, options: ["Recebida", "Em Análise", "Em Reparo", "Aguardando Peças", "Concluída", "Entregue"].map(x => ({ value: x, label: x })) }
      ]);
      if (!r.isConfirmed) return;
      o.status = r.value.status; saveDB(); toast("Status atualizado!"); render();
    }

    /* --- CLIENTES --- */
    function renderCustomers() {
      setPageTitle("Clientes");
      const rows = db.customers.map(c => `<tr>
        <td class="font-bold text-white">${safe(c.name)}</td><td>${safe(c.phone || "—")}</td><td>${safe(c.document || "—")}</td><td>${money(c.balance || 0)}</td>
        <td><button class="btn btn-ghost btn-xs text-slate-300" onclick="editCustomer('${c.id}')"><i class="bi bi-pencil"></i></button></td>
      </tr>`).reverse();
      $("content").innerHTML = pageHeader("Clientes", "Cadastro de clientes.", "Novo Cliente", "addCustomer()") +
        searchInput("Pesquisar cliente...") + table(["Nome", "Telefone", "CPF", "Saldo Fiado", "Ações"], rows);
    }
    async function addCustomer(existing = null) {
      const c = existing || {};
      const r = await modalForm(existing ? "Editar Cliente" : "Novo Cliente", [
        { id: "name", label: "Nome Completo", value: c.name || "", required: true },
        { id: "phone", label: "Telefone / WhatsApp", value: c.phone || "" },
        { id: "document", label: "CPF / Documento", value: c.document || "" }
      ]);
      if (!r.isConfirmed) return;
      const item = { ...r.value, id: c.id || uid(), balance: c.balance || 0 };
      if (existing) db.customers = db.customers.map(x => x.id === c.id ? item : x);
      else db.customers.push(item);
      saveDB(); toast("Cliente salvo!"); render();
    }
    function editCustomer(id) { const c = db.customers.find(x => x.id === id); if (c) addCustomer(c); }

    /* --- FORNECEDORES --- */
    function renderSuppliers() {
      setPageTitle("Fornecedores");
      const rows = db.suppliers.map(s => `<tr><td class="font-bold text-white">${safe(s.name)}</td><td>${safe(s.phone || "—")}</td><td>${safe(s.document || "—")}</td></tr>`).reverse();
      $("content").innerHTML = pageHeader("Fornecedores", "Contatos de fornecedores de peças.", "Novo Fornecedor", "addSupplier()") +
        table(["Nome", "Telefone", "CNPJ"], rows);
    }
    async function addSupplier() {
      const r = await modalForm("Novo Fornecedor", [{ id: "name", label: "Nome", required: true }, { id: "phone", label: "Telefone" }]);
      if (!r.isConfirmed) return;
      db.suppliers.push({ ...r.value, id: uid() }); saveDB(); toast("Fornecedor salvo!"); render();
    }

    /* --- FINANCEIRO --- */
    function renderFinance() {
      setPageTitle("Financeiro");
      const income = db.transactions.filter(t => t.type === "Entrada" && t.status === "Concluído").reduce((a, t) => a + t.value, 0);
      const expense = db.transactions.filter(t => t.type === "Saída" && t.status === "Concluído").reduce((a, t) => a + t.value, 0);
      const rows = db.transactions.slice().reverse().map(t => `<tr>
        <td>${dateBR(t.date)}</td><td>${safe(t.description)}</td>
        <td>${badge(t.type, t.type === "Entrada" ? "badge-success" : "badge-error")}</td>
        <td>${money(t.value)}</td><td>${badge(t.status, t.status === "Concluído" ? "badge-success" : "badge-warning")}</td>
      </tr>`);

      $("content").innerHTML = pageHeader("Controle Financeiro", "Entradas e despesas.", "Novo Lançamento", "addTransaction()") +
        `<div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8">
          ${metricCard("Entradas Realizadas", money(income), "arrow-up-circle", "text-emerald-400")}
          ${metricCard("Saídas / Despesas", money(expense), "arrow-down-circle", "text-rose-400")}
          ${metricCard("Saldo em Caixa", money(income - expense), "wallet2", "text-blue-400")}
        </div>` + table(["Data", "Descrição", "Tipo", "Valor", "Status"], rows);
    }
    async function addTransaction() {
      const r = await modalForm("Novo Lançamento", [
        { id: "type", label: "Tipo", type: "select", value: "Saída", options: [{ value: "Entrada", label: "Entrada" }, { value: "Saída", label: "Saída" }] },
        { id: "description", label: "Descrição", required: true },
        { id: "value", label: "Valor (R$)", type: "number", value: 0, min: 0.01, step: "0.01", required: true },
        { id: "date", label: "Data", type: "date", value: todayISO(), required: true },
        { id: "status", label: "Situação", type: "select", value: "Concluído", options: [{ value: "Concluído", label: "Pago / Recebido" }, { value: "Pendente", label: "Pendente" }] }
      ]);
      if (!r.isConfirmed) return;
      db.transactions.push({ ...r.value, id: uid(), value: Number(r.value.value) });
      saveDB(); toast("Lançamento salvo!"); render();
    }

    /* --- RELATÓRIOS --- */
    function renderReports() {
      setPageTitle("Relatórios e Estatísticas");
      $("content").innerHTML = pageHeader("Relatórios", "Análise de desempenho.") +
        `<div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl mb-6"><h4 class="font-bold text-white mb-4">Vendas dos Últimos Dias</h4><canvas id="salesChart" height="100"></canvas></div>`;
      drawChart();
    }
    function drawChart() {
      const canvas = $("salesChart"); if (!canvas) return;
      if (chartInstance) chartInstance.destroy();
      const days = [];
      for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(d.toLocaleDateString("en-CA")); }
      const values = days.map(day => db.sales.filter(s => s.date === day).reduce((a, s) => a + s.total, 0));
      chartInstance = new Chart(canvas, {
        type: "bar",
        data: { labels: days.map(dateBR), datasets: [{ data: values, backgroundColor: "#3b82f6", borderRadius: 8 }] },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: "#94a3b8" }, grid: { display: false } }, y: { ticks: { color: "#94a3b8" }, grid: { color: "#1e293b" } } } }
      });
    }

    /* --- CONFIGURAÇÕES --- */
    function renderSettings() {
      setPageTitle("Configurações");
      $("content").innerHTML = pageHeader("Configurações", "Gerencie os dados e backup.") +
        `<div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl mb-6 max-w-xl">
          <h4 class="font-bold text-white mb-4">Identificação da Empresa</h4>
          <div class="form-control w-full mb-4">
            <label class="label"><span class="label-text text-slate-400">Nome da Oficina / Loja</span></label>
            <input id="shopName" class="input input-bordered w-full bg-slate-950 border-slate-700" value="${safe(db.settings.shop)}">
          </div>
          <button class="btn btn-primary btn-sm" onclick="saveSettings()">Salvar Alterações</button>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl max-w-xl">
          <h4 class="font-bold text-white mb-4">Backup e Segurança</h4>
          <div class="flex flex-wrap gap-3">
            <button class="btn btn-outline btn-sm gap-2" onclick="exportBackup()"><i class="bi bi-download"></i> Baixar Backup JSON</button>
            <button class="btn btn-error btn-outline btn-sm gap-2" onclick="clearData()"><i class="bi bi-trash"></i> Apagar Todos os Dados</button>
          </div>
        </div>`;
    }
    function saveSettings() {
      db.settings.shop = $("shopName").value.trim() || "Oficina & Peças";
      saveDB(); $("shopTitleNav").textContent = db.settings.shop; toast("Configurações salvas!");
    }
    function exportBackup() {
      const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = url; a.download = "backup-sistema-" + todayISO() + ".json"; a.click();
      toast("Backup exportado!");
    }
    async function clearData() {
      if (!await askConfirm("Apagar tudo?", "Essa ação apagará todos os cadastros permanentemente!")) return;
      db = emptyDB(); saveDB(); toast("Dados apagados."); render();
    }

    render();
  </script>
</body>
</html>

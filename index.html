<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão Profissional | Oficina & Peças</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bs-body-bg: #0b131e;
      --bs-body-color: #e2e8f0;
      --panel-bg: #131f32;
      --border-color: #223249;
    }
    body {
      background-color: var(--bs-body-bg);
      color: var(--bs-body-color);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    /* Sidebar */
    #sidebar {
      width: 260px;
      background: #0f1726;
      border-right: 1px solid var(--border-color);
      min-height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
      transition: all 0.3s;
    }
    .brand-box {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
    }
    .nav-link {
      color: #94a3b8;
      padding: 12px 20px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: 8px;
      margin: 4px 12px;
      transition: 0.2s;
    }
    .nav-link:hover, .nav-link.active {
      color: #fff;
      background: #1e293b;
    }
    .nav-link.active {
      border-left: 4px solid #3b82f6;
    }
    /* Main Content */
    #main-content {
      margin-left: 260px;
      padding: 30px;
    }
    @media (max-width: 991px) {
      #sidebar { margin-left: -260px; }
      #sidebar.show { margin-left: 0; }
      #main-content { margin-left: 0; padding: 20px; }
    }
    /* Cards & Panels */
    .card-custom {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
    }
    /* Tables */
    .table-dark-custom {
      background-color: transparent;
      color: #e2e8f0;
    }
    .table-dark-custom th {
      background-color: #1a2a42;
      color: #94a3b8;
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
      padding: 12px;
    }
    .table-dark-custom td {
      border-bottom: 1px solid var(--border-color);
      padding: 12px;
      vertical-align: middle;
    }
    .table-dark-custom tbody tr:hover {
      background-color: #18263c;
    }
    /* Forms & Inputs */
    .form-control, .form-select {
      background-color: #0b131e;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 8px;
      padding: 10px 14px;
    }
    .form-control:focus, .form-select:focus {
      background-color: #0b131e;
      border-color: #3b82f6;
      color: #fff;
      box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
    }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <nav id="sidebar">
    <div class="brand-box d-flex align-items-center gap-3">
      <div class="bg-primary text-white p-2 rounded-3">
        <i class="bi bi-tools fs-4"></i>
      </div>
      <div>
        <h6 class="m-0 fw-bold text-white tracking-wide">OFICINA & PEÇAS</h6>
        <small class="text-muted" id="shopTitleNav">Gestão Profissional</small>
      </div>
    </div>

    <div class="py-3">
      <small class="text-uppercase text-muted px-4 fs-7 fw-bold" style="font-size: 11px; letter-spacing: 1px;">Principal</small>
      <div class="mt-2">
        <a href="#" class="nav-link active" data-page="inicio"><i class="bi bi-speedometer2"></i>Visão geral</a>
        <a href="#" class="nav-link" data-page="pdv"><i class="bi bi-cart3"></i>PDV / Vendas</a>
        <a href="#" class="nav-link" data-page="produtos"><i class="bi bi-box-seam"></i>Produtos e estoque</a>
        <a href="#" class="nav-link" data-page="oficina"><i class="bi bi-wrench-adjustable"></i>Oficina / OS</a>
        <a href="#" class="nav-link" data-page="clientes"><i class="bi bi-people"></i>Clientes</a>
        <a href="#" class="nav-link" data-page="fornecedores"><i class="bi bi-truck"></i>Fornecedores</a>
      </div>

      <small class="text-uppercase text-muted px-4 fs-7 fw-bold mt-4 d-block" style="font-size: 11px; letter-spacing: 1px;">Gestão</small>
      <div class="mt-2">
        <a href="#" class="nav-link" data-page="financeiro"><i class="bi bi-wallet2"></i>Financeiro</a>
        <a href="#" class="nav-link" data-page="relatorios"><i class="bi bi-graph-up"></i>Relatórios</a>
        <a href="#" class="nav-link" data-page="config"><i class="bi bi-gear"></i>Configurações</a>
      </div>
    </div>

    <div class="p-3 mx-3 mt-auto card-custom">
      <div class="d-flex align-items-center gap-2">
        <span class="spinner-grow spinner-grow-sm text-success" role="status"></span>
        <span class="small text-muted">Sistema Local</span>
      </div>
    </div>
  </nav>

  <!-- MAIN WRAPPER -->
  <main id="main-content">
    <!-- TOPBAR -->
    <header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary border-opacity-25">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-outline-secondary d-lg-none" id="sidebarToggle">
          <i class="bi bi-list"></i>
        </button>
        <div>
          <h4 id="pageTitle" class="fw-bold m-0 text-white">Visão geral</h4>
          <small id="todayDate" class="text-muted"></small>
        </div>
      </div>
      <div>
        <button class="btn btn-primary d-flex align-items-center gap-2" onclick="navigate('pdv')">
          <i class="bi bi-plus-lg"></i> Nova Venda
        </button>
      </div>
    </header>

    <!-- CONTENT DYNAMIC INJECTION -->
    <div id="content"></div>

    <!-- FOOTER -->
    <footer class="text-center text-muted small mt-5 pt-3 border-top border-secondary border-opacity-25">
      Sistema de Gestão Integrado · Armazenamento Local Seguro
    </footer>
  </main>

  <!-- BOOTSTRAP 5 JS BUNDLE -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    "use strict";

    const $ = id => document.getElementById(id);
    const money = n => Number(n || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    const todayISO = () => new Date().toLocaleDateString("en-CA");
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    const safe = s => String(s ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
    const dateBR = d => d ? new Date(d + "T12:00:00").toLocaleDateString("pt-BR") : "—";

    const STORAGE_KEY = "gestao_oficina_v2";

    function emptyDB() {
      return {
        products: [], customers: [], suppliers: [],
        sales: [], orders: [], transactions: [],
        settings: { shop: "Oficina & Peças", currency: "BRL" }
      };
    }

    function loadDB() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return emptyDB();
        const data = JSON.parse(raw);
        const base = emptyDB();
        return { ...base, ...data, settings: { ...base.settings, ...(data.settings || {}) } };
      } catch (e) {
        console.error(e);
        return emptyDB();
      }
    }

    let db = loadDB();
    let cart = [];
    let chartInstance = null;
    let currentPage = "inicio";

    function saveDB() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        return true;
      } catch (e) {
        toast("Erro ao salvar dados no navegador.", "error");
        return false;
      }
    }

    function toast(message, icon = "success") {
      Swal.fire({
        toast: true, position: "top-end", showConfirmButton: false,
        timer: 2500, timerProgressBar: true, icon, title: message,
        background: "#131f32", color: "#e2e8f0"
      });
    }

    async function modalForm(title, fields) {
      return Swal.fire({
        title, background: "#131f32", color: "#e2e8f0",
        confirmButtonText: "Salvar", cancelButtonText: "Cancelar",
        showCancelButton: true, focusConfirm: false,
        customClass: { confirmButton: 'btn btn-primary px-4', cancelButton: 'btn btn-secondary px-4' },
        buttonsStyling: false,
        html: fields.map(f => {
          const value = f.value ?? "";
          if (f.type === "select") {
            return `<div class="text-start mb-3">
              <label class="form-label text-muted small">${safe(f.label)}</label>
              <select id="f_${safe(f.id)}" class="form-select">
              ${f.options.map(o => `<option value="${safe(o.value)}" ${String(o.value) === String(value) ? "selected" : ""}>${safe(o.label)}</option>`).join("")}
              </select></div>`;
          }
          return `<div class="text-start mb-3">
            <label class="form-label text-muted small">${safe(f.label)}</label>
            <input id="f_${safe(f.id)}" class="form-control" type="${f.type || "text"}" value="${safe(value)}"
            ${f.required ? "required" : ""} ${f.min !== undefined ? `min="${f.min}"` : ""} ${f.step ? `step="${f.step}"` : ""} placeholder="${safe(f.placeholder || "")}">
          </div>`;
        }).join(""),
        preConfirm: () => {
          const result = {};
          for (const f of fields) {
            const el = $("f_" + f.id);
            result[f.id] = el ? el.value.trim() : "";
            if (f.required && !result[f.id]) {
              Swal.showValidationMessage("Preencha o campo: " + f.label);
              return false;
            }
          }
          return result;
        }
      });
    }

    async function askConfirm(title, text) {
      const r = await Swal.fire({
        title, text, icon: "warning", background: "#131f32", color: "#e2e8f0",
        showCancelButton: true, confirmButtonText: "Sim, confirmar", cancelButtonText: "Cancelar",
        customClass: { confirmButton: 'btn btn-danger px-4', cancelButton: 'btn btn-secondary px-4' },
        buttonsStyling: false
      });
      return r.isConfirmed;
    }

    function setPageTitle(title) {
      $("pageTitle").textContent = title;
    }

    function navigate(page) {
      currentPage = page;
      document.querySelectorAll(".nav-link").forEach(b => {
        b.classList.toggle("active", b.dataset.page === page);
      });
      const sidebar = $("sidebar");
      if (window.innerWidth < 992) sidebar.classList.remove("show");
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.querySelectorAll(".nav-link").forEach(b => {
      b.addEventListener("click", (e) => { e.preventDefault(); navigate(b.dataset.page); });
    });
    $("sidebarToggle").addEventListener("click", () => $("sidebar").classList.toggle("show"));
    $("todayDate").textContent = new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long", year: "numeric" });
    $("shopTitleNav").textContent = db.settings.shop;

    function table(headers, rows, empty = "Nenhum registro encontrado.") {
      return `<div class="table-responsive card-custom p-2"><table class="table table-dark-custom mb-0">
      <thead><tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr></thead>
      <tbody>${rows.length ? rows.join("") : `<tr><td colspan="${headers.length}" class="text-center text-muted py-5">${empty}</td></tr>`}</tbody>
      </table></div>`;
    }

    function badge(text, type = "bg-secondary text-light") {
      return `<span class="badge ${type}">${safe(text)}</span>`;
    }

    function metricCard(title, value, icon, color = "text-primary", sub = "") {
      return `<div class="card card-custom p-4 h-100">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <p class="text-muted small mb-1">${title}</p>
            <h3 class="fw-bold mb-0 text-white">${value}</h3>
          </div>
          <div class="p-3 rounded-3 bg-opacity-10 bg-primary ${color}">
            <i class="bi bi-${icon} fs-4"></i>
          </div>
        </div>
        ${sub ? `<p class="text-muted small mt-3 mb-0">${sub}</p>` : ""}
      </div>`;
    }

    function pageHeader(title, description, buttonText, action) {
      return `<div class="d-flex flex-wrap justify-between align-items-center gap-3 mb-4">
        <div>
          <h3 class="fw-bold text-white mb-1">${title}</h3>
          <p class="text-muted small m-0">${description}</p>
        </div>
        ${buttonText ? `<button class="btn btn-primary d-flex align-items-center gap-2" onclick="${action}"><i class="bi bi-plus-lg"></i>${buttonText}</button>` : ""}
      </div>`;
    }

    function searchInput(placeholder) {
      return `<div class="input-group mb-4 shadow-sm" style="max-width: 400px;">
        <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-search"></i></span>
        <input id="tableSearch" class="form-control border-secondary" placeholder="${placeholder}" oninput="filterTable(this.value)">
      </div>`;
    }

    function filterTable(val) {
      const q = val.toLowerCase();
      document.querySelectorAll("#dataTable tbody tr").forEach(tr => {
        tr.style.display = tr.textContent.toLowerCase().includes(q) ? "" : "none";
      });
    }

    function render() {
      const pages = {
        inicio: renderHome, pdv: renderPDV, produtos: renderProducts,
        oficina: renderWorkshop, clientes: renderCustomers, fornecedores: renderSuppliers,
        financeiro: renderFinance, relatorios: renderReports, config: renderSettings
      };
      (pages[currentPage] || renderHome)();
    }

    /* --- HOME --- */
    function renderHome() {
      setPageTitle("Visão geral");
      const today = todayISO();
      const todaySales = db.sales.filter(s => s.date === today);
      const revenue = todaySales.reduce((a, s) => a + s.total, 0);
      const lowStock = db.products.filter(p => p.active !== false && p.stock <= p.min);
      const pendingOS = db.orders.filter(o => o.status !== "Concluída" && o.status !== "Entregue" && o.status !== "Cancelada");

      const lowRows = lowStock.slice(0, 5).map(p => `<tr><td>${safe(p.name)}</td><td><span class="text-danger fw-bold">${p.stock}</span></td><td>${p.min}</td><td>${badge("Baixo", "bg-danger text-white")}</td></tr>`);
      const osRows = pendingOS.slice(0, 5).map(o => `<tr><td>${safe(o.number)}</td><td>${safe(o.customer)}</td><td>${safe(o.motorcycle)}</td><td>${badge(o.status, "bg-warning text-dark")}</td></tr>`);

      $("content").innerHTML = `
        <div class="row g-4 mb-4">
          <div class="col-sm-6 col-xl-3">${metricCard("Vendas de Hoje", money(revenue), "cart-check", "text-success", todaySales.length + " venda(s) realizada(s)")}</div>
          <div class="col-sm-6 col-xl-3">${metricCard("Produtos no Estoque", db.products.length, "box-seam", "text-primary")}</div>
          <div class="col-sm-6 col-xl-3">${metricCard("Ordens em Andamento", pendingOS.length, "tools", "text-warning", "Na oficina")}</div>
          <div class="col-sm-6 col-xl-3">${metricCard("Alerta de Estoque", lowStock.length, "exclamation-triangle", "text-danger", "Itens abaixo do mínimo")}</div>
        </div>

        <div class="row g-4 mb-4">
          <div class="col-xl-6">
            <div class="card card-custom p-4 h-100">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold m-0 text-white">Estoque Baixo</h5>
                <button class="btn btn-sm btn-outline-secondary" onclick="navigate('produtos')">Ver todos</button>
              </div>
              ${table(["Produto", "Qtd", "Mín", "Status"], lowRows, "Nenhum produto em alerta.")}
            </div>
          </div>
          <div class="col-xl-6">
            <div class="card card-custom p-4 h-100">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold m-0 text-white">Ordens de Serviço Abertas</h5>
                <button class="btn btn-sm btn-outline-secondary" onclick="navigate('oficina')">Ver oficina</button>
              </div>
              ${table(["OS", "Cliente", "Moto", "Status"], osRows, "Nenhuma OS em aberto.")}
            </div>
          </div>
        </div>`;
    }

    /* --- PRODUTOS --- */
    function renderProducts() {
      setPageTitle("Produtos e Estoque");
      const rows = db.products.map(p => `<tr>
        <td><code>${safe(p.code || "—")}</code></td>
        <td class="fw-bold">${safe(p.name)}</td>
        <td>${safe(p.category || "Peças")}</td>
        <td>${money(p.cost)}</td>
        <td>${money(p.price)}</td>
        <td>${p.stock <= p.min ? badge(p.stock, "bg-danger") : badge(p.stock, "bg-success")}</td>
        <td>
          <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-secondary" onclick="editProduct('${p.id}')"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-outline-primary" onclick="stockMovement('${p.id}')"><i class="bi bi-plus-slash-minus"></i></button>
            <button class="btn btn-outline-danger" onclick="deleteProduct('${p.id}')"><i class="bi bi-trash"></i></button>
          </div>
        </td>
      </tr>`).reverse();

      $("content").innerHTML = pageHeader("Gerenciamento de Produtos", "Cadastre peças, acessórios e controle seu estoque.", "Novo Produto", "addProduct()") +
        searchInput("Pesquisar produto ou código...") +
        table(["Código", "Nome", "Categoria", "Custo", "Venda", "Estoque", "Ações"], rows).replace('<table>', '<table id="dataTable" class="table table-dark-custom mb-0">');
    }

    async function addProduct(existing = null) {
      const p = existing || {};
      const r = await modalForm(existing ? "Editar Produto" : "Novo Produto", [
        { id: "code", label: "Código / SKU", value: p.code || "" },
        { id: "name", label: "Nome do Produto", value: p.name || "", required: true },
        { id: "category", label: "Categoria", value: p.category || "Peças" },
        { id: "cost", label: "Preço de Custo (R$)", type: "number", value: p.cost ?? 0, min: 0, step: "0.01" },
        { id: "price", label: "Preço de Venda (R$)", type: "number", value: p.price ?? 0, min: 0, step: "0.01" },
        { id: "stock", label: "Quantidade em Estoque", type: "number", value: p.stock ?? 0, min: 0, step: "1" },
        { id: "min", label: "Estoque Mínimo", type: "number", value: p.min ?? 2, min: 0, step: "1" }
      ]);
      if (!r.isConfirmed) return;
      const item = { ...r.value, id: p.id || uid(), cost: Number(r.value.cost), price: Number(r.value.price), stock: Number(r.value.stock), min: Number(r.value.min), active: true };
      if (existing) db.products = db.products.map(x => x.id === p.id ? item : x);
      else db.products.push(item);
      saveDB(); toast("Produto salvo com sucesso!"); render();
    }
    function editProduct(id) { const p = db.products.find(x => x.id === id); if (p) addProduct(p); }
    async function deleteProduct(id) {
      if (!await askConfirm("Excluir produto?", "Essa ação não poderá ser desfeita.")) return;
      db.products = db.products.filter(p => p.id !== id);
      saveDB(); toast("Produto excluído."); render();
    }
    async function stockMovement(id) {
      const p = db.products.find(x => x.id === id); if (!p) return;
      const r = await modalForm("Movimentar Estoque: " + p.name, [
        { id: "kind", label: "Tipo de Movimento", type: "select", value: "Entrada", options: [{ value: "Entrada", label: "Entrada" }, { value: "Saída", label: "Saída" }] },
        { id: "qty", label: "Quantidade", type: "number", value: 1, min: 1, required: true },
        { id: "reason", label: "Motivo / Observação", value: "Ajuste de estoque" }
      ]);
      if (!r.isConfirmed) return;
      const qty = Number(r.value.qty);
      if (r.value.kind === "Saída" && qty > p.stock) return toast("Estoque insuficiente!", "error");
      p.stock += r.value.kind === "Entrada" ? qty : -qty;
      saveDB(); toast("Estoque atualizado!"); render();
    }

    /* --- PDV --- */
    function renderPDV() {
      setPageTitle("PDV / Frente de Caixa");
      const options = db.products.filter(p => p.active !== false).map(p => `<option value="${p.id}">${safe(p.name)} — ${money(p.price)} (Disp: ${p.stock})</option>`).join("");
      const cartRows = cart.map((c, i) => `<tr>
        <td>${safe(c.name)}</td><td>${c.qty}</td><td>${money(c.price)}</td><td>${money(c.qty * c.price)}</td>
        <td><button class="btn btn-sm btn-outline-danger" onclick="removeCart(${i})"><i class="bi bi-x-lg"></i></button></td>
      </tr>`);
      const total = cart.reduce((a, c) => a + c.qty * c.price, 0);

      $("content").innerHTML = `
        <div class="row g-4">
          <div class="col-lg-8">
            <div class="card card-custom p-4 mb-4">
              <h5 class="fw-bold mb-3 text-white">Adicionar Produtos</h5>
              <div class="row g-3">
                <div class="col-md-7">
                  <select id="cartProduct" class="form-select"><option value="">Selecione um produto...</option>${options}</select>
                </div>
                <div class="col-md-3">
                  <input id="cartQty" class="form-control" type="number" min="1" value="1">
                </div>
                <div class="col-md-2">
                  <button class="btn btn-primary w-100" onclick="addCart()">Adicionar</button>
                </div>
              </div>
            </div>
            <div class="card card-custom p-4">
              <h5 class="fw-bold mb-3 text-white">Itens no Carrinho</h5>
              ${table(["Produto", "Qtd", "Unitário", "Subtotal", ""], cartRows, "Nenhum item adicionado.")}
            </div>
          </div>
          <div class="col-lg-4">
            <div class="card card-custom p-4">
              <h5 class="fw-bold mb-3 text-white">Resumo da Venda</h5>
              <div class="mb-3">
                <label class="form-label text-muted small">Cliente</label>
                <select id="saleCustomer" class="form-select">
                  <option value="">Consumidor Final</option>
                  ${db.customers.map(c => `<option value="${c.id}">${safe(c.name)}</option>`).join("")}
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label text-muted small">Forma de Pagamento</label>
                <select id="salePayment" class="form-select">
                  <option>Pix</option><option>Dinheiro</option><option>Débito</option><option>Crédito</option><option>A prazo</option>
                </select>
              </div>
              <div class="mb-4">
                <label class="form-label text-muted small">Observações</label>
                <input id="saleNote" class="form-control" placeholder="Opcional">
              </div>
              <div class="d-flex justify-content-between align-items-center mb-4 p-3 bg-dark rounded-3">
                <span class="text-muted">Total:</span>
                <h3 class="fw-bold text-success m-0">${money(total)}</h3>
              </div>
              <button class="btn btn-success w-full py-2 fw-bold mb-2" onclick="finishSale()">Finalizar Venda</button>
              <button class="btn btn-outline-secondary w-full" onclick="cart=[];render()">Limpar Carrinho</button>
            </div>
          </div>
        </div>`;
    }

    function addCart() {
      const id = $("cartProduct").value;
      const qty = Number($("cartQty").value);
      const p = db.products.find(x => x.id === id);
      if (!p) return toast("Selecione um produto.", "error");
      const existing = cart.find(c => c.id === id);
      const wanted = qty + (existing ? existing.qty : 0);
      if (wanted > p.stock) return toast("Estoque insuficiente!", "error");
      if (existing) existing.qty += qty;
      else cart.push({ id: p.id, name: p.name, price: p.price, qty });
      render();
    }
    function removeCart(i) { cart.splice(i, 1); render(); }

    async function finishSale() {
      if (!cart.length) return toast("Carrinho vazio.", "error");
      const payment = $("salePayment").value;
      const total = cart.reduce((a, c) => a + c.qty * c.price, 0);
      const sale = {
        id: uid(), number: "VD-" + Date.now().toString().slice(-6),
        date: todayISO(), customer: db.customers.find(c => c.id === $("saleCustomer").value)?.name || "Consumidor Final",
        payment, total, items: [...cart]
      };
      cart.forEach(c => db.products.find(x => x.id === c.id).stock -= c.qty);
      db.sales.push(sale);
      db.transactions.push({ id: uid(), date: todayISO(), type: "Entrada", description: `Venda ${sale.number}`, value: total, status: payment === "A prazo" ? "Pendente" : "Concluído" });
      saveDB(); cart = [];
      await Swal.fire({ icon: "success", title: "Venda realizada com sucesso!", background: "#131f32", color: "#e2e8f0" });
      render();
    }

    /* --- OFICINA / OS --- */
    function renderWorkshop() {
      setPageTitle("Oficina / Ordens de Serviço");
      const rows = db.orders.map(o => `<tr>
        <td><strong>${safe(o.number)}</strong></td>
        <td>${safe(o.customer)}</td>
        <td>${safe(o.motorcycle)}</td>
        <td>${safe(o.problem)}</td>
        <td>${badge(o.status, o.status === "Concluída" ? "bg-success" : "bg-warning text-dark")}</td>
        <td>${money(o.value)}</td>
        <td>
          <button class="btn btn-sm btn-outline-secondary" onclick="editOrder('${o.id}')"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-sm btn-outline-primary" onclick="orderStatus('${o.id}')"><i class="bi bi-arrow-repeat"></i></button>
        </td>
      </tr>`).reverse();

      $("content").innerHTML = pageHeader("Ordens de Serviço", "Gerencie reparos, motos e andamento da oficina.", "Nova OS", "addOrder()") +
        searchInput("Pesquisar OS, cliente ou moto...") +
        table(["Nº OS", "Cliente", "Moto", "Defeito", "Status", "Valor", "Ações"], rows).replace('<table>', '<table id="dataTable" class="table table-dark-custom mb-0">');
    }

    async function addOrder(existing = null) {
      const o = existing || {};
      const r = await modalForm(existing ? "Editar OS" : "Nova Ordem de Serviço", [
        { id: "customer", label: "Nome do Cliente", value: o.customer || "", required: true },
        { id: "motorcycle", label: "Moto / Modelo / Placa", value: o.motorcycle || "", required: true },
        { id: "problem", label: "Defeito Relatado", value: o.problem || "", required: true },
        { id: "service", label: "Serviço Executado", value: o.service || "" },
        { id: "value", label: "Valor Total (R$)", type: "number", value: o.value ?? 0, min: 0, step: "0.01" },
        { id: "status", label: "Status", type: "select", value: o.status || "Recebida", options: ["Recebida", "Em Análise", "Em Reparo", "Aguardando Peças", "Concluída", "Entregue"].map(x => ({ value: x, label: x })) }
      ]);
      if (!r.isConfirmed) return;
      const item = { ...r.value, id: o.id || uid(), number: o.number || "OS-" + Date.now().toString().slice(-5), date: o.date || todayISO(), value: Number(r.value.value) };
      if (existing) db.orders = db.orders.map(x => x.id === o.id ? item : x);
      else db.orders.push(item);
      saveDB(); toast("Ordem de serviço salva!"); render();
    }
    function editOrder(id) { const o = db.orders.find(x => x.id === id); if (o) addOrder(o); }
    async function orderStatus(id) {
      const o = db.orders.find(x => x.id === id); if (!o) return;
      const r = await modalForm("Alterar Status da " + o.number, [
        { id: "status", label: "Novo Status", type: "select", value: o.status, options: ["Recebida", "Em Análise", "Em Reparo", "Aguardando Peças", "Concluída", "Entregue"].map(x => ({ value: x, label: x })) }
      ]);
      if (!r.isConfirmed) return;
      o.status = r.value.status; saveDB(); toast("Status atualizado!"); render();
    }

    /* --- CLIENTES --- */
    function renderCustomers() {
      setPageTitle("Clientes");
      const rows = db.customers.map(c => `<tr>
        <td><strong>${safe(c.name)}</strong></td><td>${safe(c.phone || "—")}</td><td>${safe(c.document || "—")}</td><td>${money(c.balance || 0)}</td>
        <td><button class="btn btn-sm btn-outline-secondary" onclick="editCustomer('${c.id}')"><i class="bi bi-pencil"></i></button></td>
      </tr>`).reverse();
      $("content").innerHTML = pageHeader("Clientes", "Cadastro de clientes.", "Novo Cliente", "addCustomer()") +
        searchInput("Pesquisar cliente...") + table(["Nome", "Telefone", "CPF", "Saldo Fiado", "Ações"], rows).replace('<table>', '<table id="dataTable" class="table table-dark-custom mb-0">');
    }
    async function addCustomer(existing = null) {
      const c = existing || {};
      const r = await modalForm(existing ? "Editar Cliente" : "Novo Cliente", [
        { id: "name", label: "Nome Completo", value: c.name || "", required: true },
        { id: "phone", label: "Telefone / WhatsApp", value: c.phone || "" },
        { id: "document", label: "CPF / Documento", value: c.document || "" }
      ]);
      if (!r.isConfirmed) return;
      const item = { ...r.value, id: c.id || uid(), balance: c.balance || 0 };
      if (existing) db.customers = db.customers.map(x => x.id === c.id ? item : x);
      else db.customers.push(item);
      saveDB(); toast("Cliente salvo!"); render();
    }
    function editCustomer(id) { const c = db.customers.find(x => x.id === id); if (c) addCustomer(c); }

    /* --- FORNECEDORES --- */
    function renderSuppliers() {
      setPageTitle("Fornecedores");
      const rows = db.suppliers.map(s => `<tr><td><strong>${safe(s.name)}</strong></td><td>${safe(s.phone || "—")}</td><td>${safe(s.document || "—")}</td></tr>`).reverse();
      $("content").innerHTML = pageHeader("Fornecedores", "Contatos de fornecedores de peças.", "Novo Fornecedor", "addSupplier()") +
        table(["Nome", "Telefone", "CNPJ"], rows);
    }
    async function addSupplier() {
      const r = await modalForm("Novo Fornecedor", [{ id: "name", label: "Nome", required: true }, { id: "phone", label: "Telefone" }]);
      if (!r.isConfirmed) return;
      db.suppliers.push({ ...r.value, id: uid() }); saveDB(); toast("Fornecedor salvo!"); render();
    }

    /* --- FINANCEIRO --- */
    function renderFinance() {
      setPageTitle("Financeiro");
      const income = db.transactions.filter(t => t.type === "Entrada" && t.status === "Concluído").reduce((a, t) => a + t.value, 0);
      const expense = db.transactions.filter(t => t.type === "Saída" && t.status === "Concluído").reduce((a, t) => a + t.value, 0);
      const rows = db.transactions.slice().reverse().map(t => `<tr>
        <td>${dateBR(t.date)}</td><td>${safe(t.description)}</td>
        <td>${badge(t.type, t.type === "Entrada" ? "bg-success" : "bg-danger")}</td>
        <td>${money(t.value)}</td><td>${badge(t.status, t.status === "Concluído" ? "bg-success" : "bg-warning text-dark")}</td>
      </tr>`);

      $("content").innerHTML = pageHeader("Controle Financeiro", "Entradas e despesas.", "Novo Lançamento", "addTransaction()") +
        `<div class="row g-4 mb-4">
          <div class="col-md-4">${metricCard("Entradas Realizadas", money(income), "arrow-up-circle", "text-success")}</div>
          <div class="col-md-4">${metricCard("Saídas / Despesas", money(expense), "arrow-down-circle", "text-danger")}</div>
          <div class="col-md-4">${metricCard("Saldo em Caixa", money(income - expense), "wallet2", "text-primary")}</div>
        </div>` + table(["Data", "Descrição", "Tipo", "Valor", "Status"], rows);
    }
    async function addTransaction() {
      const r = await modalForm("Novo Lançamento", [
        { id: "type", label: "Tipo", type: "select", value: "Saída", options: [{ value: "Entrada", label: "Entrada" }, { value: "Saída", label: "Saída" }] },
        { id: "description", label: "Descrição", required: true },
        { id: "value", label: "Valor (R$)", type: "number", value: 0, min: 0.01, step: "0.01", required: true },
        { id: "date", label: "Data", type: "date", value: todayISO(), required: true },
        { id: "status", label: "Situação", type: "select", value: "Concluído", options: [{ value: "Concluído", label: "Pago / Recebido" }, { value: "Pendente", label: "Pendente" }] }
      ]);
      if (!r.isConfirmed) return;
      db.transactions.push({ ...r.value, id: uid(), value: Number(r.value.value) });
      saveDB(); toast("Lançamento salvo!"); render();
    }

    /* --- RELATÓRIOS --- */
    function renderReports() {
      setPageTitle("Relatórios e Estatísticas");
      $("content").innerHTML = pageHeader("Relatórios", "Análise de desempenho.") +
        `<div class="card card-custom p-4 mb-4"><h5 class="fw-bold text-white mb-3">Vendas dos Últimos Dias</h5><canvas id="salesChart" height="100"></canvas></div>`;
      drawChart();
    }
    function drawChart() {
      const canvas = $("salesChart"); if (!canvas) return;
      if (chartInstance) chartInstance.destroy();
      const days = [];
      for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(d.toLocaleDateString("en-CA")); }
      const values = days.map(day => db.sales.filter(s => s.date === day).reduce((a, s) => a + s.total, 0));
      chartInstance = new Chart(canvas, {
        type: "bar",
        data: { labels: days.map(dateBR), datasets: [{ data: values, backgroundColor: "#3b82f6", borderRadius: 6 }] },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: "#94a3b8" }, grid: { display: false } }, y: { ticks: { color: "#94a3b8" }, grid: { color: "#223249" } } } }
      });
    }

    /* --- CONFIGURAÇÕES --- */
    function renderSettings() {
      setPageTitle("Configurações");
      $("content").innerHTML = pageHeader("Configurações", "Gerencie os dados e backup.") +
        `<div class="card card-custom p-4 mb-4">
          <h5 class="fw-bold text-white mb-3">Identificação da Empresa</h5>
          <label class="form-label text-muted small">Nome da Oficina / Loja</label>
          <input id="shopName" class="form-control mb-3" value="${safe(db.settings.shop)}">
          <button class="btn btn-primary" onclick="saveSettings()">Salvar Alterações</button>
        </div>
        <div class="card card-custom p-4">
          <h5 class="fw-bold text-white mb-3">Backup e Segurança</h5>
          <button class="btn btn-outline-light me-2" onclick="exportBackup()"><i class="bi bi-download"></i> Baixar Backup JSON</button>
          <button class="btn btn-outline-danger" onclick="clearData()"><i class="bi bi-trash"></i> Apagar Todos os Dados</button>
        </div>`;
    }
    function saveSettings() {
      db.settings.shop = $("shopName").value.trim() || "Oficina & Peças";
      saveDB(); $("shopTitleNav").textContent = db.settings.shop; toast("Configurações salvas!");
    }
    function exportBackup() {
      const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = url; a.download = "backup-sistema-" + todayISO() + ".json"; a.click();
      toast("Backup exportado!");
    }
    async function clearData() {
      if (!await askConfirm("Apagar tudo?", "Essa ação apagará todos os cadastros permanentemente!")) return;
      db = emptyDB(); saveDB(); toast("Dados apagados."); render();
    }

    render();
  </script>
</body>
</html>
